# Configuration for voucher push integration test

debug: true

server:
  addr: "localhost:8080"
  ext_addr: "localhost:8080"
  use_tls: false
  insecure_tls: false

database:
  path: "/tmp/fdo_push_test.db"
  password: ""

manufacturing:
  device_ca_key_type: "ec384"
  owner_key_type: "ec384"
  generate_certificates: true
  first_time_init: false

voucher_management:
  persist_to_db: true
  voucher_files:
    directory: "/tmp/fdo_voucher_files_push"
  save_to_disk:
    directory: "/tmp/fdo_voucher_files_push"
  owner_signover:
    mode: "static"
    static_public_key: |
      -----BEGIN PUBLIC KEY-----
      MHYwEAYHKoZIzj0CAQYFK4EEACIDYgAEX3GSr1Ryr+K7wYnumv+1fD9xq9/0IkW9
      TKswoYbWDKo49GKtMRNLaEvp1vNjSInkpqBFaLWrDaocxmU+FWUzEgDzWCQXdkn/
      oMu7OhlxuEnB4LVNA7yH2hxdpykt0Zjm
      -----END PUBLIC KEY-----
    timeout: "5s"
  voucher_signing:
    mode: "external"
    owner_key_type: "ec384"
    first_time_init: false
    external_command: "bash tests/test_hsm_digest_mock.sh {requestfile} {requestid} {station}"
    external_timeout: "30s"
    manufacturer_public_key_file: "tests/test_manufacturer.pub"
  voucher_upload:
    enabled: false
  push_service:
    enabled: true
    url: "http://localhost:9090/push"
    auth_token: "test-token"
    mode: "send_always"
    retain_files: true
    delete_after_success: false
    retry_interval: "2s"
    max_attempts: 3
  destination_callback:
    enabled: false
  did_push:
    enabled: false
  retry_worker:
    enabled: true
    retry_interval: "2s"
    max_attempts: 3
